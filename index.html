<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Calculator</title>
  <style>
    body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; font-family: Arial, sans-serif; margin: 0; }
    .calculator { background-color: #222; padding: 20px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); width: 260px; }
    #display { width: 100%; height: 50px; font-size: 24px; text-align: right; margin-bottom: 15px; padding: 10px; box-sizing: border-box; border: none; border-radius: 6px; background-color: #333; color: #fff; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { padding: 15px; font-size: 18px; border: none; border-radius: 6px; cursor: pointer; background-color: #444; color: white; }
    .operator { background-color: #ff9500; }
    .clear { background-color: #ff3b30; grid-column: span 2; }
    .equals { background-color: #34c759; grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" readonly>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendValue('/')">÷</button>
      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('*')">×</button>
      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">−</button>
      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('+')">+</button>
      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>
  <script>
    const display = document.getElementById('display');
    const appendValue = v => display.value += v;
    const clearDisplay = () => display.value = '';
    const deleteLast = () => display.value = display.value.slice(0, -1);
    const calculate = () => { try { display.value = eval(display.value); } catch { display.value = 'Error'; } };
  </script>
</body>
</html>
